<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Peta dan daftar bioskop di kota Anda.">
  <meta name="theme-color" content="#ffffff">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="https://unpkg.com/font-awesome@4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/map.css">
  <title>Bioskop</title>
</head>

<body>
  <header class="app-header">
    <span class="app-name">Bioskop</span>
    <button type="button" class="city-button" id="city-button" aria-haspopup="dialog" aria-controls="city-dialog">
      <span id="city-label">Bandung</span>
      <i class="fa fa-caret-down" aria-hidden="true"></i>
    </button>
  </header>

  <main class="app-main app-main--map">
    <h1 class="visually-hidden" id="cinema-page-title">Bioskop</h1>

    <div class="map-area">
      <div class="map-canvas" id="map" role="region" aria-label="Peta bioskop"></div>

      <p class="map-hint" id="map-hint" hidden>Ketuk penanda untuk melihat detail bioskop</p>

      <div class="map-empty" id="map-empty" hidden>
        <p id="map-empty-message"></p>
      </div>

      <section class="cinema-preview" id="cinema-preview" aria-label="Detail bioskop" hidden>
        <div class="cinema-preview-media">
          <img class="cinema-preview-image" id="cinema-preview-image" alt="">
          <div class="cinema-preview-fallback" id="cinema-preview-fallback" hidden aria-hidden="true">
            <i class="fa fa-building"></i>
          </div>
        </div>
        <div class="cinema-preview-body">
          <h2 class="cinema-preview-name" id="cinema-preview-name"></h2>
          <p class="cinema-preview-address" id="cinema-preview-address"></p>
        </div>
        <button type="button" class="icon-button cinema-preview-close" id="cinema-preview-close"
          aria-label="Tutup detail bioskop">
          <i class="fa fa-times" aria-hidden="true"></i>
        </button>
      </section>
    </div>
  </main>

  <nav class="app-nav" aria-label="Navigasi utama">
    <a class="nav-item" href="index.html">
      <i class="fa fa-home" aria-hidden="true"></i>
      <span>Home</span>
    </a>
    <a class="nav-item" href="bioskop.html" aria-current="page">
      <i class="fa fa-building" aria-hidden="true"></i>
      <span>Bioskop</span>
    </a>
  </nav>

  <dialog class="city-dialog" id="city-dialog" aria-labelledby="city-dialog-title">
    <div class="city-dialog-head">
      <h2 id="city-dialog-title">Pilih kota</h2>
      <button type="button" class="icon-button" id="city-dialog-close" aria-label="Tutup">
        <i class="fa fa-times" aria-hidden="true"></i>
      </button>
    </div>
    <ul class="city-options" id="city-options"></ul>
  </dialog>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/cinema.js"></script>
</body>

</html>
